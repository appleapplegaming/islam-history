# Third line of defence after the pre-commit hook and the Claude Code hooks: catches anything
# committed with --no-verify or outside Claude, and lists every human guard override for review.
name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Mutation score on lines this change touched (90% for new code)
        if: github.event_name == 'pull_request'
        run: npm run mutate:changed -- "${{ github.event.pull_request.base.sha }}"
      - name: Mutation score of the whole codebase (ratchet in stryker.config.mjs)
        run: npm run mutate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            test-results/
            reports/mutation/
      - name: Guard every commit (honours human Factory-Allow overrides)
        run: npm run guard -- "${{ github.event.pull_request.base.sha || github.event.before }}"
